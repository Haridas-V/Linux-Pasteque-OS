---
# Finalisation Pastèque après copie du système sur le disque :
# - verrouiller root, sudo contrôlé (wheel), pare-feu actif
# - retirer l'autologin live, activer SDDM Wayland pour l'utilisateur créé
# - hostname, locales FR, initramfs régénéré sur la cible, GRUB installé
# - activer les services Pastèque (updater, corbeille, indexation, anti-cheat)
dontChroot: false
timeout: 60
script:
  - /usr/local/bin/pasteque-finalize-install
