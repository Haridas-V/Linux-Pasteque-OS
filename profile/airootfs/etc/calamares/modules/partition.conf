---
# Linux seul : effacer le disque ENTIER, avec confirmation explicite obligatoire.
eraseDisk: true
# "Installer a cote" (dual-boot) apparait automatiquement si os-prober detecte un autre OS.
# Case "Chiffrer le systeme" (LUKS) affichee en mode automatique :
enableLuksAutomatedPartitioning: true
userSwapChoices: [ none ]
fs: "btrfs"
allowManualPartitioning: false
showAdvancedOptions: false
