---
# Pastèque Linux — séquence Calamares : 4 écrans, aucune option technique par défaut.
modules-search: [ /usr/lib/calamares/modules ]
branding: pasteque
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - bootloader
      - grubcfg
      # shellprocess (pasteque-finalize-install) APRES bootloader/grubcfg :
      # il réinstalle la chaîne EFI SIGNÉE sur l'ESP (Calamares a écrit un
      # grubx64.efi non signé) pour que le système installé bootte sous Secure Boot
      - shellprocess
      - umount
poll-interval: 5
timeout: 30
quit-at-end: true
