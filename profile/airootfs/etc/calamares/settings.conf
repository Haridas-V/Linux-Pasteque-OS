---
# Pastèque Linux — séquence Calamares : 4 écrans, aucune option technique par défaut.
modules-search: [ /usr/lib/calamares/modules ]
branding: pasteque
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - shellprocess
      - bootloader
      - grubcfg
      - umount
poll-interval: 5
timeout: 30
quit-at-end: true
