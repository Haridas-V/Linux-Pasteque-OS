# ============================================================
# Pastèque Linux — configuration centrale (lisible, modifiable)
# Toute la personnalisation post-installation passe par ce fichier.
# ============================================================

# Niveau d'immuabilité (0 = Arch classique ouvert .. 5 = /usr en lecture seule)
IMMUTABILITY_LEVEL=0

# Mises à jour automatiques en arrière-plan (1=oui, 0=non)
AUTO_UPDATE=0   # mises a jour MANUELLES par defaut (bouton Gestionnaire Pasteque)
# Ne mettre à jour que si la machine est au repos (idle)
UPDATE_ONLY_WHEN_IDLE=1
# Rollback automatique via snapshots Btrfs en cas de boot échoué
AUTO_ROLLBACK=1

# Taille max de la corbeille de sauvegarde rotative (Go)
ROTATING_TRASH_GB=10

# Indexation automatique des .exe / AppImages dans le menu KDE
APP_INDEXER=1

# Avertissement anti-cheat au lancement des jeux concernés
ANTICHEAT_WARNINGS=1
